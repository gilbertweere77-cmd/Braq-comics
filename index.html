
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  signOut, signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getDatabase, ref, push, set, remove, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRpDawRqQ5HdPS9CA8LYwdtD33aR55VGg",
  authDomain: "braq-comics.firebaseapp.com",
  databaseURL: "https://braq-comics-default-rtdb.firebaseio.com",
  projectId: "braq-comics",
  storageBucket: "braq-comics.firebasestorage.app",
  messagingSenderId: "920213534307",
  appId: "1:920213534307:web:ed2b3817aca45b42b7aa56",
  measurementId: "G-ZPL1K6JGS3"
};

const OWNER_UID = "QElBi9D0CbhZMDpNt4ttG5auo683";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

const $ = (id) => document.getElementById(id);
const escapeText = (value) => String(value ?? "");
let isOwner = false;
let currentUser = null;
let mediaItems = {};
let applauseItems = {};
let chatItems = {};
let logoTaps = 0;
let logoTapTimer;
let authReady = false;

function notice(message) {
  alert(message);
}

function setOwnerUI(owner) {
  isOwner = owner;
  const banner = $("ownerControlBanner");
  const uploadButton = $("openUploadBtn");
  if (banner) banner.hidden = !owner;
  if (banner) banner.style.display = owner ? "" : "none";
  if (uploadButton) uploadButton.style.display = owner ? "" : "none";
  const nameButton = $("nameBtn");
  if (nameButton) nameButton.textContent = owner ? "OWNER MODE" : "MEMBER";
}

function showTab(tab) {
  document.querySelectorAll(".nav-btn").forEach((button) => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
  ["home", "movies", "music", "games", "tv", "chat"].forEach((id) => {
    const section = $(id);
    if (section) section.style.display = id === tab ? "" : "none";
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll(".nav-btn[data-tab]").forEach((button) => {
  button.addEventListener("click", () => showTab(button.dataset.tab));
});
document.querySelectorAll("[data-go]").forEach((button) => {
  button.addEventListener("click", () => showTab(button.dataset.go));
});

if ($("adminUnlockBrand")) {
  $("adminUnlockBrand").addEventListener("click", () => {
    logoTaps++;
    clearTimeout(logoTapTimer);
    logoTapTimer = setTimeout(() => { logoTaps = 0; }, 1800);
    if (logoTaps >= 5) {
      logoTaps = 0;
      if (isOwner) {
        signOut(auth).catch((error) => notice(error.message));
      } else {
        ownerLogin();
      }
    }
  });
}

async function ownerLogin() {
  const email = prompt("Enter your owner email address:");
  if (!email) return;
  const password = prompt("Enter your Firebase account password:");
  if (!password) return;

  try {
    const credential = await signInWithEmailAndPassword(auth, email.trim(), password);
    if (credential.user.uid !== OWNER_UID) {
      await signOut(auth);
      notice("Access denied: this account is not the configured owner.");
      return;
    }
    setOwnerUI(true);
    notice("Owner mode enabled.");
  } catch (error) {
    notice("Owner sign-in failed: " + error.message);
  }
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  authReady = true;
  setOwnerUI(Boolean(user && user.uid === OWNER_UID));
  if (!user) {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      console.error("Visitor sign-in failed:", error);
    }
  }
});

function categoryKey(value) {
  const key = String(value || "").toLowerCase();
  if (key.includes("movie") || key.includes("film")) return "movies";
  if (key.includes("music") || key.includes("song") || key.includes("audio")) return "music";
  if (key.includes("game")) return "games";
  if (key.includes("tv") || key.includes("live")) return "tv";
  return "movies";
}

function makeMediaCard(id, item) {
  const card = document.createElement("article");
  card.className = "media-card";
  card.dataset.title = (item.title || "").toLowerCase();

  const title = document.createElement("h3");
  title.textContent = item.title || "Untitled";
  card.appendChild(title);

  const type = document.createElement("p");
  type.textContent = item.category || "Media";
  card.appendChild(type);

  const fileUrl = item.fileURL;
  if (fileUrl && /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(fileUrl)) {
    const img = document.createElement("img");
    img.src = fileUrl;
    img.alt = item.title || "Media image";
    img.loading = "lazy";
    img.style.maxWidth = "100%";
    card.appendChild(img);
  } else if (fileUrl && /\.(mp3|wav|ogg|m4a)(\?|$)/i.test(fileUrl)) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = fileUrl;
    audio.style.width = "100%";
    card.appendChild(audio);
  } else if (fileUrl && /\.(mp4|webm|mov|m4v)(\?|$)/i.test(fileUrl)) {
    const video = document.createElement("video");
    video.controls = true;
    video.preload = "metadata";
    video.src = fileUrl;
    video.style.width = "100%";
    video.style.maxHeight = "360px";
    card.appendChild(video);
  } else if (fileUrl) {
    const link = document.createElement("a");
    link.href = fileUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open media";
    card.appendChild(link);
  }

  if (isOwner) {
    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", async () => {
      if (!confirm(`Delete "${item.title || "this item"}"?`)) return;
      try {
        await remove(ref(db, `media/${id}`));
        if (item.storagePath) {
          // Storage cleanup is best-effort; database rules still protect content.
          const { deleteObject } = await import(
            "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js"
          );
          await deleteObject(storageRef(storage, item.storagePath)).catch(console.warn);
        }
      } catch (error) {
        notice("Delete failed: " + error.message);
      }
    });
    card.appendChild(deleteButton);
  }
  return card;
}

function renderMedia() {
  const destinations = {
    movies: $("movieGrid"),
    music: $("musicGrid"),
    games: $("gameGrid"),
    tv: $("tvGrid")
  };
  Object.values(destinations).forEach((grid) => {
    if (grid) grid.replaceChildren();
  });

  const featured = $("featured");
  if (featured) featured.replaceChildren();

  Object.entries(mediaItems).forEach(([id, item]) => {
    if (!item || !item.fileURL) return;
    const category = categoryKey(item.category);
    const grid = destinations[category];
    if (grid) grid.appendChild(makeMediaCard(id, item));
    if (featured) featured.appendChild(makeMediaCard(id, item));
  });
  applySearch();
}

onValue(ref(db, "media"), (snapshot) => {
  mediaItems = snapshot.val() || {};
  renderMedia();
}, (error) => console.error("Media read error:", error));

if ($("openUploadBtn")) {
  $("openUploadBtn").addEventListener("click", () => {
    if (!isOwner) return notice("Sign in as the owner to upload media.");
    if ($("uploadModal")) $("uploadModal").style.display = "flex";
  });
}
if ($("closeModal")) {
  $("closeModal").addEventListener("click", () => {
    if ($("uploadModal")) $("uploadModal").style.display = "none";
  });
}

if ($("modalUploadForm")) {
  $("modalUploadForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!isOwner || auth.currentUser?.uid !== OWNER_UID) {
      return notice("Only the owner can upload media.");
    }

    const category = $("modalCat")?.value;
    const title = $("modalTitle")?.value.trim();
    const file = $("modalFile")?.files?.[0];
    if (!category || !title || !file) {
      return notice("Please choose a category, enter a title, and select a file.");
    }
    if (file.size > 100 * 1024 * 1024) {
      return notice("This file is over 100 MB. Choose a smaller file.");
    }
    if (!/^(image|audio|video)\//i.test(file.type)) {
      return notice("Please choose an image, audio, or video file.");
    }

    const submitButton = event.submitter;
    if (submitButton) submitButton.disabled = true;
    try {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = `media/${auth.currentUser.uid}/${Date.now()}_${safeName}`;
      const target = storageRef(storage, path);
      await uploadBytes(target, file, { contentType: file.type });
      const fileURL = await getDownloadURL(target);
      const record = push(ref(db, "media"));
      await set(record, {
        title,
        category,
        fileURL,
        storagePath: path,
        originalFileName: file.name,
        contentType: file.type,
        size: file.size,
        uploadedAt: Date.now(),
        ownerUid: auth.currentUser.uid
      });
      $("modalUploadForm").reset();
      if ($("uploadModal")) $("uploadModal").style.display = "none";
      notice("Upload complete!");
    } catch (error) {
      console.error(error);
      notice("Upload failed: " + error.message +
        "\nCheck that Realtime Database and Storage are enabled and their rules are installed.");
    } finally {
      if (submitButton) submitButton.disabled = false;
    }
  });
}

function renderApplause() {
  document.querySelectorAll(".applaud-bar").forEach((bar) => {
    const button = bar.querySelector(".applaud-btn");
    const count = bar.querySelector(".num");
    if (!button || !count) return;
    const itemId = button.dataset.item;
    count.textContent = Object.keys(applauseItems[itemId] || {}).length;
    const already = Boolean(applauseItems[itemId]?.[auth.currentUser?.uid]);
    button.setAttribute("aria-pressed", String(already));
  });
}

onValue(ref(db, "applauds"), (snapshot) => {
  applauseItems = snapshot.val() || {};
  renderApplause();
});

document.querySelectorAll(".applaud-btn[data-item]").forEach((button) => {
  button.addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) return notice("Please wait for sign-in, then try again.");
    const path = `applauds/${button.dataset.item}/${user.uid}`;
    try {
      const already = applauseItems[button.dataset.item]?.[user.uid];
      if (already) await remove(ref(db, path));
      else await set(ref(db, path), true);
    } catch (error) {
      notice("Applause could not be saved: " + error.message);
    }
  });
});

function renderChat() {
  const container = $("chatMessages");
  if (!container) return;
  container.replaceChildren();
  Object.entries(chatItems)
    .sort((a, b) => (a[1]?.createdAt || 0) - (b[1]?.createdAt || 0))
    .slice(-200)
    .forEach(([id, message]) => {
      if (!message) return;
      const row = document.createElement("div");
      row.className = "chat-message";
      const name = document.createElement("strong");
      name.textContent = (message.name || "Visitor") + ": ";
      const body = document.createElement("span");
      body.textContent = message.text || "";
      row.append(name, body);
      container.appendChild(row);
    });
  container.scrollTop = container.scrollHeight;
}

onValue(ref(db, "chat"), (snapshot) => {
  chatItems = snapshot.val() || {};
  renderChat();
}, (error) => console.error("Chat read error:", error));

if ($("chatForm")) {
  $("chatForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = $("chatInput");
    const message = input?.value.trim();
    if (!message) return;
    if (message.length > 500) return notice("Messages must be 500 characters or fewer.");
    if (!auth.currentUser) return notice("Please wait for sign-in, then try again.");
    try {
      await set(push(ref(db, "chat")), {
        name: auth.currentUser.uid === OWNER_UID ? "Owner" : "Visitor",
        text: message,
        uid: auth.currentUser.uid,
        createdAt: Date.now()
      });
      input.value = "";
    } catch (error) {
      notice("Message failed: " + error.message);
    }
  });
}

if ($("clearChat")) {
  $("clearChat").addEventListener("click", async () => {
    if (!isOwner) return notice("Only the owner can clear the public chat.");
    if (!confirm("Delete all chat messages?")) return;
    try {
      await remove(ref(db, "chat"));
    } catch (error) {
      notice("Could not clear chat: " + error.message);
    }
  });
}

function applySearch() {
  const query = ($("search")?.value || "").trim().toLowerCase();
  document.querySelectorAll(".media-card").forEach((card) => {
    card.style.display = !query || (card.dataset.title || "").includes(query) ? "" : "none";
  });
}
if ($("search")) $("search").addEventListener("input", applySearch);

// Keep the initial tab consistent with the page's existing navigation.
showTab("home");
 </script>
