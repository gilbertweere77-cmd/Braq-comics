
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAQ-COMICS | Movies & Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#1c293d;padding:22px 15px;text-align:center}
h1{color:#f5b942;margin:0}
header p{color:#ddd}
main{max-width:900px;margin:auto;padding:16px}
input{width:100%;padding:14px;border:0;border-radius:8px;font-size:16px}
nav{display:flex;gap:8px;margin:18px 0}
button{padding:12px;border:0;border-radius:8px;background:#26364c;color:white;flex:1}
h2{color:#f5b942}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#1c293d;padding:12px;border-radius:12px;overflow-wrap:anywhere}
.poster{font-size:45px;text-align:center;background:#293951;padding:20px;border-radius:8px}
.card p{color:#cbd5e1;font-size:14px}
.download{display:block;text-align:center;background:#f5b942;color:#101827;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold}
footer{text-align:center;color:#bbb;padding:25px;font-size:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>BRAQ-COMICS</h1>
<p>Your destination for movies and Android games</p>
</header>
<main>
<input id="search" placeholder="Search movies and games...">
<nav>
<button onclick="filter('all')">All</button>
<button onclick="filter('movie')">Movies</button>
<button onclick="filter('game')">Games</button>
</nav>
<h2>Explore Downloads</h2>
<div class="grid" id="items">
<article class="card" data-type="movie">
<div class="poster">🎬</div>
<h3>My First Movie</h3>
<p>Movie • MP4 format</p>
<a class="download" href="#" onclick="alert('Add your movie download link first');return false">Download Movie</a>
</article>
<article class="card" data-type="game">
<div class="poster">🎮</div>
<h3>My First Game</h3>
<p>Android game • APK</p>
<a class="download" href="#" onclick="alert('Add your game download link first');return false">Download Game</a>
</article>
</div>
<p id="empty" hidden>No matching items found.</p>
</main>
<footer>
BRAQ-COMICS © 2026<br>
Only distribute content you have permission to share.
</footer>
<script>
let selected='all';
function filter(type){selected=type;update()}
function update(){
let q=document.getElementById('search').value.toLowerCase(),n=0;
document.querySelectorAll('.card').forEach(c=>{
c.hidden=!((selected==='all'||c.dataset.type===selected)&&c.innerText.toLowerCase().includes(q));
if(!c.hidden)n++;
});
document.getElementById('empty').hidden=n>0;
}
document.getElementById('search').addEventListener('input',update);
</script>
</body>
</html>
